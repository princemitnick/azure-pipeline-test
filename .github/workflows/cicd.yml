name: CI-CD Fast (DockerHub + VM)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_REPO }}
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build_scan_push:
    name: Build -> Scan -> Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag output
        id: set_tag
        run: echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build (load to local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
      
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push tags to Docker Hub
        run: |
          set -e
          docker push $IMAGE_REPO:${IMAGE_TAG}
          docker push $IMAGE_REPO:latest

  deploy_vm:
    name: Deploy on VM
    needs: build_scan_push
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy (Pull + Up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "in" >> ~/sessions.txt
            echo "${{ needs.build_scan_push.outputs.image_tag }}" >> ~/session.txt

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export DOCKERHUB_REPO="${{ secrets.DOCKERHUB_REPO }}"
            export TAG="${{ needs.build_scan_push.outputs.image_tag }}"

            echo "${TAG}" >> ~/sessions.txt
            echo "${DOCKERHUB_REPO}" >> ~/sessions.txt

            echo "Deploying docker.io/${DOCKERHUB_REPO}:${TAG}"

            # Pull explicitly (you’ll see a clear error if the tag doesn’t exist)
            docker pull docker.io/${DOCKERHUB_REPO}:${TAG}

            # Compose uses env substitution for ${DOCKERHUB_REPO} and ${TAG}
            DOCKERHUB_REPO="$DOCKERHUB_REPO" TAG="$TAG" \
              docker compose -f /opt/fastapi/docker-compose.yml pull

            DOCKERHUB_REPO="$DOCKERHUB_REPO" TAG="$TAG" \
              docker compose -f /opt/fastapi/docker-compose.yml up -d --remove-orphans

            docker image prune -f
            docker logout